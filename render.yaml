services:
  - type: web
    name: smart-attend-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: FACE_ENGINE
        value: opencv
      - key: JWT_DAYS
        value: "7"
      - key: PYTHON_VERSION
        value: 3.11.9
